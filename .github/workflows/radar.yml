name: Radar eBay (cada hora)

on:
  schedule:
    - cron: "7 * * * *"      # cada hora; GitHub puede retrasarlo unos minutos
  workflow_dispatch:          # botón para correrlo a mano
    inputs:
      prueba_aviso:
        description: "Reenviar la última alerta por Telegram/correo como prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar publicaciones nuevas y comparar con el mercado
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERTA_EMAIL: ${{ secrets.ALERTA_EMAIL }}
          LOOKBACK_HORAS: "3"
          PRUEBA_AVISO: ${{ inputs.prueba_aviso && '1' || '' }}
        run: |
          mkdir -p data
          set -o pipefail
          python radar_ebay.py 2>&1 | tee data/ultimo_log.txt
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "Radar $(date -u +'%F %H:%M')" || echo "Sin cambios"
          git pull --rebase
          git push
