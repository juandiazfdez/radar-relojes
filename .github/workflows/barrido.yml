name: Barrido completo del mercado

on:
  workflow_dispatch:
    inputs:
      finalistas_max:
        description: "Maximo de finalistas a abrir y revisar con fotos"
        default: "600"

permissions:
  contents: write

concurrency:
  group: barrido
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Barrido
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODEL: "claude-sonnet-5-5"
          FINALISTAS_MAX: ${{ inputs.finalistas_max }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data
          set -o pipefail
          python barrido.py 2>&1 | tee data/barrido_log.txt
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/barrido_* data/mercado_barrido.json || true
          git commit -m "Barrido completo $(date -u +'%F %H:%M')" || echo "Sin cambios"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
