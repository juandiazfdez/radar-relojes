name: Calibrar alertas del barrido
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calibrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python calibrar.py 2>&1 | tee data/calibrar_log.txt
      - if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/barrido_calibrado.json data/calibrar_log.txt || true
          git commit -m "Calibracion del barrido" || echo "Sin cambios"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
